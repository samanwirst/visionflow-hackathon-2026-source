events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api_rate:1m rate=10r/s;
    server {
        listen 8088;
        client_max_body_size 25m;
        auth_basic "VisionFlow private demo";
        auth_basic_user_file /run/secrets/demo_auth;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location /api/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://api:8000;
            proxy_read_timeout 120s;
        }
        location /media/ { proxy_pass http://api:8000; }
        location / { proxy_pass http://web:3000; }
    }
}
