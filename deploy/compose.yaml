name: visionflow-private-demo
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "127.0.0.1:18085:8000"
    environment:
      VISIONFLOW_DEMO_SAFE: "true"
      CORS_ORIGINS: http://127.0.0.1:13085,http://localhost:13085
      DETECTOR_MODEL: /app/data/models/yolo11n.pt
      VLM_BASE_URL: ""
      VLM_MODEL: ""
      VLM_API_KEY: ""
    volumes:
      - demo-data:/app/data
      - model-cache:/home/visionflow/.cache
    restart: "no"
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:18085
    ports:
      - "127.0.0.1:13085:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
volumes:
  demo-data:
  model-cache:
